name: Docker CI/CD Pipeline

on:
  push:
    branches:
      - Master
    paths:
      - 'public/**'
      - 'Dockerfile'

jobs:
  docker-ci:
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t node-app:v1 .

      - name: Run Test Container
        run: |
          docker rm -f testcontainer || true
          docker run -d --name testcontainer -p 3000:3000 node-app:v1

      - name: Test Container
        run: |
          sleep 10
          curl -f http://localhost:3000

      - name: Show Container Logs
        if: failure()
        run: docker logs testcontainer || true

      - name: Remove Test Container
        if: always()
        run: docker rm -f testcontainer || true

      - name: Login to Docker Hub
        if: success()
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag Docker Image
        if: success()
        run: |
          docker tag node-app:v1 ${{ secrets.DOCKERHUB_USERNAME }}/node-app:v1

      - name: Push Docker Image
        if: success()
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/node-app:v1

  deploy:
    needs: docker-ci
    runs-on: [self-hosted, Linux, X64]
    environment: production

    steps:
      - name: Deploy Docker Container
        run: |
          docker rm -f production-app || true
          docker run -d --name production-app -p 8080:3000 \
            ${{ secrets.DOCKERHUB_USERNAME }}/node-app:v1

      - name: Verify Deployment
        run: |
          sleep 10
          curl -f http://localhost:8080
